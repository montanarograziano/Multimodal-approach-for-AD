[project]
site_url = "https://montanarograziano.github.io/Multimodal-approach-for-AD/"
site_name = "Multimodal AD Detection"
site_description = "3D MRI + amyloid PET multimodal Alzheimer's disease detection: research code accompanying the Scientific Reports paper"
site_author = "Graziano Montanaro, Andrea Esposito"

repo_url = "https://github.com/montanarograziano/Multimodal-approach-for-AD"
repo_name = "montanarograziano/Multimodal-approach-for-AD"
edit_uri = "edit/main/docs/"

nav = [
  { "Overview" = "index.md" },
  { "Methodology" = "methodology.md" },
  { "Installation" = "installation.md" },
  { "Data access & contracts" = "data-access.md" },
  { "Reproducibility" = "reproducibility.md" },
  { "Development & testing" = "development.md" },
  { "API reference" = "api.md" },
  { "Legacy notebook inventory" = "legacy-notebooks-inventory.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.superfences = {}
