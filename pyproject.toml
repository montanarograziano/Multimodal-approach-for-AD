[project]
name = "multimodal-ad"
version = "0.1.0"
description = "Code for 'Automated Detection of Alzheimer's Disease: A Multi-modal Approach With 3D MRI and Amyloid PET' paper"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
science = [
    "matplotlib>=3.10.0",
    "nibabel>=5.3.2",
    "numpy>=2.2.1",
    "opencv-python>=4.11.0.86",
    "p-tqdm>=1.4.2",
    "pandas>=2.2.3",
    "pillow>=11.1.0",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.1",
    "tensorflow>=2.20.0",
    "tf-keras-vis>=0.8.7",
]

[dependency-groups]
dev = [
    "pyrefly>=0.13.1",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.2",
]
notebooks = [
    "ipykernel>=6.29.5",
    "notebook>=7.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multimodal_ad"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Legacy research notebooks are out of scope for lint/format (see
# docs/legacy-notebooks-inventory.md); they are preserved as-is until ported.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src"]
python-version = "3.13"

[tool.pytest.ini_options]
addopts = "--cov=multimodal_ad --cov-report=term-missing"
testpaths = ["tests"]
