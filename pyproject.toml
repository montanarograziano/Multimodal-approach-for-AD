[project]
name = "multimodal-ad"
version = "0.1.0"
description = "Code for 'Automated Detection of Alzheimer's Disease: A Multi-modal Approach With 3D MRI and Amyloid PET' paper"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
# Unconditionally imported by src/multimodal_ad/data/*; must be runtime deps
# (see AGENTS.md). TensorFlow/tf-keras-vis stay model-specific/optional since
# no scientific code imports them yet.
dependencies = [
    "nibabel>=5.3.2",
    "numpy>=2.2.1",
    "opencv-python>=4.11.0.86",
    "pandas>=2.2.3",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.1",
]

[project.optional-dependencies]
# Model/training/evaluation/Grad-CAM code (`multimodal_ad.models`) imports
# TensorFlow unconditionally; kept optional so `multimodal_ad.data` and the
# CLI install/run without pulling in TensorFlow. `tf-keras-vis`/`mlflow`
# (used by the legacy notebooks for Grad-CAM and experiment tracking) are
# intentionally dropped: Grad-CAM is now a native `tf.GradientTape` port
# (see `multimodal_ad.models.gradcam`), and no new tracking framework
# replaces the notebooks' DagsHub/MLflow wiring (see AGENTS.md).
model = [
    "tensorflow>=2.20.0",
]
# Plotting-only dependencies for notebook-adjacent visualization, not
# imported by any `multimodal_ad` runtime code.
science = [
    "matplotlib>=3.10.0",
    "pillow>=11.1.0",
]

[dependency-groups]
dev = [
    "prek>=0.2.9",
    "pyrefly>=0.13.1",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.2",
]
notebooks = [
    "ipykernel>=6.29.5",
    "notebook>=7.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multimodal_ad"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Legacy research notebooks are out of scope for lint/format (see
# docs/legacy-notebooks-inventory.md); they are preserved as-is until ported.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src"]
python-version = "3.13"

[tool.pytest.ini_options]
addopts = "--cov=multimodal_ad --cov-report=term-missing"
testpaths = ["tests"]
